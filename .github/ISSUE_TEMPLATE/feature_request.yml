name: Feature request
description: Suggest a concrete improvement
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this improve?
      description: Describe the use case and preferred behavior. English or Russian is fine.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Related device / platform

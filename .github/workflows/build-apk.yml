name: Build CMF Buds Controller APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android SDK Licenses & Install Platform 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build and Prepare APK
        run: |
          ./gradlew testDebugUnitTest assembleRelease --stacktrace
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk CMF_Buds_Pro_2_Manager.apk
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk CMF_Buds_Pro_2_Manager.apk
          else
            echo "Release APK was not produced" >&2
            exit 1
          fi
          sha256sum CMF_Buds_Pro_2_Manager.apk > SHA256SUMS.txt

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CMF-Buds-Pro-2-Controller-APK
          path: CMF_Buds_Pro_2_Manager.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CMF_Buds_Pro_2_Manager.apk
            SHA256SUMS.txt
          name: CMF Companion ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Announce release on Discord
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            python - <<'PY' > discord-payload.json
          import json, os
          tag = os.environ["RELEASE_TAG"]
          url = f"https://github.com/copilotfather/cmf-buds-pro-2-manager/releases/tag/{tag}"
          print(json.dumps({"content": f"CMF Buds Pro 2 Manager {tag} is released: {url}"}))
          PY
            curl --fail --silent --show-error -H "Content-Type: application/json" --data-binary @discord-payload.json "$DISCORD_WEBHOOK"
          else
            echo "DISCORD_WEBHOOK secret is not configured; skipping Discord announcement."
          fi
